<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Onelots — Downloads{% if path %} · {{ path }}{% endif %}{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/onelots.png?v={{ ASSET_VER }}">

  <!-- Fonts -->
  <link rel="preload" href="/static/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Theme -->
  <meta name="theme-color" content="#0d0d0f">
  <meta name="description" content="{% block description %}Unofficial LineageOS and Evolution X builds by Onelots.{% endblock %}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Onelots — Builds">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ SITE_URL }}{{ request.path }}">
  <meta property="og:image" content="{{ SITE_URL }}/static/og.jpg?v={{ ASSET_VER }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Onelots — Builds">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.title() }}">
  <meta name="twitter:description" content="{{ self.description() }}">
  <meta name="twitter:image" content="{{ SITE_URL }}/static/og.jpg?v={{ ASSET_VER }}">
  <link rel="stylesheet" href="/static/style.css?v={{ ASSET_VER }}">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M21 8v13H3V8"/><rect x="1" y="3" width="22" height="5"/><path d="M10 12h4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 7V4m3 3V4m3 3V4M9 20v-3m3 3v-3m3 3v-3M7 9H4m3 3H4m3 3H4m16-6h-3m3 3h-3m3 3h-3"/></symbol>
    <symbol id="i-sum" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></symbol>
  </svg>
  <div id="nprogress"></div>

  <header>
    <a href="/" class="logo"><img src="/static/onelots.png?v={{ ASSET_VER }}" width="24" height="24" alt="">Onelots — Builds</a>
  </header>
  <div class="page">
    {% block content %}{% endblock %}
  </div>

  <script>
    const bar = document.getElementById('nprogress');

    function showLoading() {
      bar.className = 'running';
    }

    function hideLoading() {
      bar.className = 'done';
      setTimeout(() => { bar.className = ''; }, 500);
    }

    // Intercept all same-origin link clicks (skip download links, anchors, external)
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || href.startsWith('#') || a.target === '_blank') return;
      try {
        const url = new URL(href, location.href);
        if (url.origin !== location.origin) return;
      } catch { return; }
      // Skip download route — browser handles that
      if (href.includes('/download/')) return;
      showLoading();
    });

    // Intercept search form submit
    document.addEventListener('submit', e => {
      const form = e.target.closest('form');
      if (!form) return;
      showLoading();
      // Put the search button into loading state
      const btn = form.querySelector('button[type="submit"]');
      if (btn) {
        btn.classList.add('loading');
        btn.insertAdjacentHTML('afterbegin', '<span class="btn-spinner"></span>');
      }
    });

    // Hide as soon as the new page starts painting (pageshow covers back/forward too)
    window.addEventListener('pageshow', hideLoading);
    // Safety net — hide if somehow already loaded
    if (document.readyState === 'complete') hideLoading();
    else window.addEventListener('load', hideLoading);

    // Copy S3 path buttons
    document.addEventListener('click', e => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      navigator.clipboard.writeText(btn.dataset.s3path).then(() => {
        btn.classList.add('copied');
        btn.title = 'Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.title = 'Copy S3 path';
        }, 1500);
      });
    });
  </script>
  <script src="https://keepandroidopen.org/banner.js" defer></script>
</body>
</html>
